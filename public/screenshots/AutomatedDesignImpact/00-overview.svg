<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="#0b0f14" />

  <!-- Step 1 -->
  <rect x="180" y="20" width="540" height="80" rx="16" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-width="1.5" />
  <text x="450" y="55" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">A reference drawing is revised</text>
  <text x="450" y="82" text-anchor="middle" fill="#9ca3af" font-size="15">e.g. an installation drawing attached to an operation</text>

  <line x1="450" y1="100" x2="450" y2="140" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <rect x="130" y="140" width="640" height="90" rx="16" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-width="1.5" />
  <text x="450" y="176" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">Impact analysis runs automatically</text>
  <text x="450" y="203" text-anchor="middle" fill="#9ca3af" font-size="15">where-referenced, filtered to Operation Revisions -- finds every</text>
  <text x="450" y="222" text-anchor="middle" fill="#9ca3af" font-size="15">latest operation revision that still references the drawing</text>

  <line x1="450" y1="230" x2="450" y2="270" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3 -->
  <rect x="180" y="270" width="540" height="80" rx="16" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-width="1.5" />
  <text x="450" y="305" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">Filtered to what MES already has</text>
  <text x="450" y="332" text-anchor="middle" fill="#9ca3af" font-size="15">only operations already published to MES need a resend</text>

  <line x1="450" y1="350" x2="450" y2="390" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4 -->
  <rect x="130" y="390" width="640" height="90" rx="16" fill="#fb923c" fill-opacity="0.14" stroke="#fb923c" stroke-width="1.5" />
  <text x="450" y="426" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">Each affected operation is auto-resent</text>
  <text x="450" y="453" text-anchor="middle" fill="#9ca3af" font-size="15">from Teamcenter to Opcenter EX-DS, with the updated drawing</text>
  <text x="450" y="472" text-anchor="middle" fill="#9ca3af" font-size="15">attached -- no manually rebuilt list</text>

  <line x1="450" y1="480" x2="450" y2="520" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5 -->
  <rect x="180" y="520" width="540" height="80" rx="16" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="1.5" />
  <text x="450" y="555" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600">The shop floor sees the current print</text>
  <text x="450" y="582" text-anchor="middle" fill="#9ca3af" font-size="15">without anyone chasing down which operations went stale</text>
</svg>
